server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  config:
    import:
#      - classpath:agent/test-agent-02.yml
#      - classpath:agent/test-agent.yml
#      - classpath:agent/only-one-agent.yml
#      - classpath:agent/ssh-agent.yml
      - classpath:agent/code-agent.yml
#      - classpath:agent/parallel_research_app.yml
  datasource:
    username: root
    password: 123456!@#
    url: jdbc:mysql://localhost:3306/walissh?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1

# 模式三：企业级混合模型动态路由与智能体配置
ai:
  # 主全栈 Agent (FameCode Agent) 模型连接配置
  agent:
    unified:
      base-url: http://10.0.0.104:8080
      api-key: EMPTY
      completions-path: v1/chat/completions
      embeddings-path: v1/embeddings
      chat-model: Qwen3.8-27B

  # 动态路由通道配置
  route:
    # 通道 A: 行内极速补全模型 (Ghost Text)
    # 动态机制：未在此显式指定 base-url/model 时，自动继承 intent-ai-api 或已激活的主 Agent
    inline-completion:
      enabled: true
      max-tokens: 128
      temperature: 0.1
      timeout-ms: 3500

# AI API Configuration (意图识别与任务拆解专属通道)
intent-ai-api:
  base-url: http://10.0.0.104:8080
  api-key: EMPTY
  completions-path: v1/chat/completions
  embeddings-path: v1/embeddings
  chat-model:
    model: Qwen3.8-27B

# MyBatis 配置
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml